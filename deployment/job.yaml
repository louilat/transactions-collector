apiVersion: batch/v1
kind: Job
metadata:
  name: tx-collector
spec:
  template:
    spec:
      containers:
      - name: tx-collector
        image: louilat/transactions-collector:latest
        imagePullPolicy: Always
        env:
        - name: PROVIDER
          valueFrom:
            secretKeyRef:
              name: secrets-tx-collector
              key: PROVIDER
        - name: ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: secrets-tx-collector
              key: ACCESS_KEY_ID
        - name: SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: secrets-tx-collector
              key: SECRET_ACCESS_KEY
        - name: START_DATE
          value: "2024-01-14"
        - name: STOP_DATE
          value: "2024-01-15"
      restartPolicy: OnFailure
  backoffLimit: 4